name: Generar extra.json

# Cada vez que alguien sube/quita algo en extra/, regenera manifests/extra.json
# automáticamente. Tus compañeros no tienen que ejecutar nada.
on:
  push:
    paths:
      - 'extra/**'
  workflow_dispatch:        # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generar manifests/extra.json
        run: python tools/build_extra_manifest.py

      - name: Subir el manifest actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/extra.json
          if git diff --staged --quiet; then
            echo "Sin cambios en extra.json"
          else
            git commit -m "Auto: actualizar extra.json"
            git push
          fi
